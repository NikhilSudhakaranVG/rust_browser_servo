apply plugin: 'com.android.application'

android {

    compileSdk = 37
    namespace 'de.baumann.browser'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "de.baumann.browser"
        minSdk 29
        targetSdk 37

        versionCode 159
        versionName "24"

        // Servo engine only ships aarch64 (ARM64) for release.
        // Remove the filter below if you build an x86 variant for emulators.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
        disable 'MissingTranslation'
    }

    // Required: Servo renders via OpenGL ES
    defaultConfig.resConfigs "en" // optional: reduce APK size

    sourceSets {
        main {
            res.srcDirs = [
                'src/main/res/common',
                'src/main/res/main',
                'src/main/res/settings',
                'src/main/res/dialogs',
                'src/main/res/translations'
            ]
        }
    }
}

dependencies {
    // ── Existing dependencies (keep during migration) ──────────────────
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.webkit:webkit:1.17.0'         // WebViewEngine fallback
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.core:core:1.13.1'

    // ── Servo engine ────────────────────────────────────────────────────
    // Requires: place servo-aarch64-android.aar in servoview-local/
    // See servoview-local/README.md for download instructions.
    // Uncomment the line below once the AAR is in place:
    // implementation project(':servoview-local')
}